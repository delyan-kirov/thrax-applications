name: Pages

# Build the browser playground (the Thrax compiler crates to wasm) and publish
# web/site/ to GitHub Pages. The compiler is checked out alongside this repo and
# this repo is nested where a submodule would sit (compiler/applications), so the
# playground's relative path to the compiler crates resolves.

on:
  push:
    branches: [master]
  # The compiler lives in another repo, so a push here is not the only thing
  # that changes what the site serves: the build takes the compiler's master.
  # Without a clock the published site stays pinned to the last push here, which
  # is how it once ran a week-old compiler. A nightly rebuild tracks the
  # compiler within a day and needs no cross-repo token.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Thrax compiler
        uses: actions/checkout@v4
        with:
          repository: delyan-kirov/BC
          path: compiler

      - name: Check out this repo into the compiler tree
        uses: actions/checkout@v4
        with:
          path: compiler/applications

      - uses: cachix/install-nix-action@v27

      - name: Build the playground
        working-directory: compiler/applications
        run: |
          nix develop ./web --command bash -c '
            set -e
            cargo build -p playground --target wasm32-unknown-unknown --release
            cp target/wasm32-unknown-unknown/release/playground.wasm web/site/playground.wasm
            node web/smoke.mjs
          '

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: compiler/applications/web/site

      - id: deployment
        uses: actions/deploy-pages@v4
