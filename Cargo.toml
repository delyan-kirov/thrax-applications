[workspace]
resolver = "2"
members = [
    "web/playground",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Applications depend on the compiler, never the reverse: the compiler workspace
# (crates/) does not know this directory exists. The playground reaches the
# compiler crates by relative path (../../crates/...), which resolves when this
# directory sits inside a Thrax checkout (as a submodule). Building it therefore
# requires the surrounding compiler tree; that is the intended, one-way coupling.
